apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "game-api.fullname" . }}
  labels:
    {{- include "game-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # A client holds a gRPC connection open; maxUnavailable: 0 keeps a replica in the Service throughout.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "game-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "game-api.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "game-api.fullname" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
            - name: http
              containerPort: {{ .Values.service.httpPort }}
          {{- if .Values.env }}
          env:
            {{- toYaml .Values.env | nindent 12 }}
          {{- end }}
          {{- if .Values.secret.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.secret.existingSecret }}
          {{- end }}
          {{- if .Values.probes.path }}
          # The health extension is in the build, so this path exists and the chart can probe it.
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          {{- else }}
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 30
            periodSeconds: 20
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # A JVM writes to /tmp; a read-only root filesystem needs somewhere for it.
        - name: tmp
          emptyDir: {}
