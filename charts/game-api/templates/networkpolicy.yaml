{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "game-api.fullname" . }}
  labels:
    {{- include "game-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "game-api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: {{ .Values.service.grpcPort }}
          protocol: TCP
        - port: {{ .Values.service.httpPort }}
          protocol: TCP
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        {{- range .Values.networkPolicy.datastorePorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
{{- end }}
